[project]
name = "adaptive-regime-radar"
version = "0.2.0"
description = "Multi-asset regime detection, early warning and constrained allocation research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "yfinance>=0.2.54", "matplotlib>=3.7", "scikit-learn>=1.2", "scipy>=1.9"]

[project.optional-dependencies]
research = ["hmmlearn>=0.3", "cvxpy>=1.4", "jupyterlab>=4"]

# No install needed: scripts add src/ to sys.path themselves.
